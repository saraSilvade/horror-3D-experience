
<!DOCTYPE html >
<html>
  <head>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>The Haunted House </title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
 
     <div class="horror-vignette"></div>
      <a-scene background="color: #0b132b" fog="type: exponential; color: #070f24; density: 0.03">
        <a-sound
  src="sounds/wind.mp3.mp3"
  autoplay="true"
  loop="true">
</a-sound>
   <audio id="doorSound" src="sounds/door.mp3"></audio>
      <a-assets>
        <a-asset-item id="house-structure" src="models/house.glb"></a-asset-item>
      </a-assets>

      <a-entity id="haunted-house" gltf-model="#house-structure" position="0 0 0" scale="0.3 0.3 0.3" rotation="0 200 0" animation-mixer></a-entity>></a-entity>

      <a-entity id="rig" position="0 0 4.5" movement-controls="fly: false">
        <a-entity camera look-controls position="0 1.8 0">
         
          <a-light type="spot" color="#e0e1dd" intensity="2" angle="30" distance="20"></a-light>
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#1c2541" intensity="0.3"></a-light>

     

      <a-light id="scare-light" type="point" color="#38bdf8" intensity="0" position="0 2 -3"></a-light>

    </a-scene>

  </body>
</html>
