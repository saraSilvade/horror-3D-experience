<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <title>The Haunted House</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/door.js" defer></script>
    <script src="js/enter.js" defer></script>
    <script src="js/character.js"></script>

    <script src="js/room.js" defer></script>
    <script src="js/jumpscare.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="horror-vignette"></div>
    <div id="game-help">
      <h2>THE HAUNTED HOUSE</h2>

      <p>🖱 Click anywhere to begin</p>

      <p>⌨ Use W A S D to move</p>

      <p>🚪 Press E near the doors</p>
    </div>

    <audio id="doorSound" src="sounds/door.mp3"></audio>

    <a-scene
      background="color: #0b132b"
      fog="type: exponential; color: #070f24; density: 0.03"
    >
      <!-- Outside the house -->
      <a-assets>
        <a-asset-item
          id="house-structure"
          src="models/house.glb"
        ></a-asset-item>
      </a-assets>
      <a-entity id="outside-world">
        <a-entity
          id="haunted-house"
          gltf-model="#house-structure"
          position="0 0 0"
          scale="0.5 0.5 0.5"
          rotation="0 200 0"
          animation-mixer
        ></a-entity>
        <audio id="windSound" loop>
          <source src="sounds/wind.mp3" type="audio/mpeg" />
        </audio>
      </a-entity>

      <a-entity id="rig" position="0 0 8" movement-controls="fly: false">
        <a-camera
          position="0 1.5 0"
          look-controls="pointerLockEnabled: true"
          wasd-controls="acceleration: 30"
        >
        </a-camera>

        <a-entity id="leftHand" laser-controls="hand: left"> </a-entity>

        <a-entity id="rightHand" laser-controls="hand: right"> </a-entity>
      </a-entity>

      <a-entity id="outside-lights">
        <a-light type="ambient" color="#1c2541" intensity="0.3"></a-light>
      </a-entity>

      <a-light
        id="scare-light"
        type="point"
        color="#38bdf8"
        intensity="0"
        position="0 2 -3"
      ></a-light>

      <a-text
        id="doorText"
        value="Press E to open"
        position="0 3 -4"
        align="center"
        color="#FFF"
        visible="false"
      >
      </a-text>

      <a-entity id="doorPivot" position="-1.8 0 -2">
        <a-box
          width="1"
          height="2"
          depth="0.1"
          visible="false"
          position="0 1 0"
        ></a-box>
      </a-entity>

      <a-box
        id="doorTrigger"
        position="-1.8 0 0"
        width="2"
        height="3"
        depth="2"
        visible="false"
      >
      </a-box>
      <!-- Inside House Environment -->

      <a-assets>
        <a-asset-item
          id="corridorModel"
          src="models/corridor.glb"
        ></a-asset-item>
        <a-asset-item id="phantom-model" src="models/ghost.glb"></a-asset-item>
      </a-assets>

      <a-entity id="inside-world" visible="false">
        <a-light
          id="inside-light"
          type="ambient"
          color="#ffffff"
          intensity="0.18"
        >
        </a-light>

        <a-entity gltf-model="#corridorModel" position="0 0 -25" scale="5 5 5">
        </a-entity>

        <a-entity id="spawn-point" position="-27 5 -12"> </a-entity>

        <audio id="insideSound" loop>
          <source src="sounds/inside-sound.mp3" type="audio/mpeg" />
        </audio>
        <audio id="doorOpenSound" src="sounds/door-opens.mp3"></audio>
        <audio id="crySound" src="sounds/cry.mp3"></audio>
        <!-- Character-->
 

   <a-entity
          id="corridor-phantom"
          gltf-model="#phantom-model"
          position="-30 0 -48"
          scale="10 10 10"
          rotation="0 25 0"
          visible="false"
          animation-mixer="clip: *; loop: repeat"
        >
        </a-entity>



      </a-entity>
      <a-box
        id="bathroomDoor"
        position="-27 5 -34"
        width="4"
        height="4"
        depth="1"
        visible="false"
      >
      </a-box>

      <!-- Inside the room -->
      <a-assets>
        <a-asset-item id="bathroomRoom" src="models/bathroom.glb">
        </a-asset-item>

        <a-asset-item id="bathtubModel" src="models/bathtub.glb">
        </a-asset-item>

        <a-asset-item id="toiletModel" src="models/toilet.glb"> </a-asset-item>
        <a-asset-item
          id="bloodyFloor"
          src="models/bloody-floor.glb"
        ></a-asset-item>
        <a-asset-item id="zombieModel" src="models/zombie.glb"></a-asset-item>
        <a-asset-item id="mirrorModel" src="models/mirror.glb"></a-asset-item>
        <a-asset-item
          id="scaryModel"
          src="models/scary-women.glb"
        ></a-asset-item>
      </a-assets>

      <a-entity id="bathroom-world" visible="false">
        <a-light
          type="point"
          color="#ff3333"
          intensity="0.5"
          distance="10"
          position="0 2 0"
        >
        </a-light>

        <a-light
          type="point"
          color="#aa0000"
          intensity="0.3"
          distance="6"
          position="2 1 -2"
        >
        </a-light>

        <a-entity
          id="bathroom-room"
          gltf-model="#bathroomRoom"
          position="0 0 0"
          scale="1 1 1"
        >
        </a-entity>

        <a-entity
          id="bathtub"
          gltf-model="#bathtubModel"
          position="0 0 -2"
          rotation="0 90 0"
          scale="1 1 1"
        >
        </a-entity>

        <a-entity
          id="toilet"
          gltf-model="#toiletModel"
          position="-6 0 -3"
          rotation="0 25 0"
          scale="4 4 4"
        >
        </a-entity>
        <a-entity
          id="bloody-floor"
          gltf-model="#bloodyFloor"
          position="0 0 0"
          scale="3 3 3"
        >
        </a-entity>

        <a-entity
          id="zombie"
          gltf-model="#zombieModel"
          position="2 0.5 -2"
          scale="3 3 3"
          rotation="0 -90 0"
        >
        </a-entity>

        <a-entity
          id="mirror"
          gltf-model="#mirrorModel"
          position="-2 4 -5"
          scale="1 1 1"
          rotation="0 -90 0"
        >
        </a-entity>
        <a-entity
          id="scary-women"
          gltf-model="#scaryModel"
          position="-2 2 5"
          scale="5 5 5"
          rotation="0 -75 0"
          visible="false"
        >
        </a-entity>

        <a-entity id="bathroom-spawn" position="0 1.9 22"> </a-entity>

        <a-entity
          id="scary-women"
          gltf-model="#scaryModel"
          position="-2 2 5"
          scale="5 5 5"
          visible="false"
        >
        </a-entity>

        <audio id="jumpScareSound">
          <source src="sounds/scream.mp3" type="audio/mpeg" />
        </audio>
        <a-light
          id="woman-light"
          type="spot"
          position="1 6 4"
          color="#ffffff"
          intensity="0"
          angle="25"
          penumbra="0.8"
          distance="10"
          target="#scary-women"
        >
        </a-light>
      </a-entity>
    </a-scene>
  </body>
</html>
